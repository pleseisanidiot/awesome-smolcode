model = "qwen3.5:9b"
api_url = "http://127.0.0.1:11434/v1/chat/completions"
permission = "ask" # read-only | ask | auto
sandbox = "required" # required bubblewrap | none (explicitly unrestricted subprocesses)
network = false # subprocess networking; model and Telegram use their own connections
max_calls = 64
timeout = 60
max_output = 65536
max_tokens = 8192
# skill_dirs = ["/absolute/path/to/skills"]

