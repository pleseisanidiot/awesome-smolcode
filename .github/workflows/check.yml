name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev bubblewrap
      - run: make && make check
      - run: python -m unittest discover -s tests_python -v
      - run: python -m pip install .
      - run: awesome-smolcode --help
