<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awesome Smolcode</title>
<style>
:root{color-scheme:dark;--bg:#0f131b;--panel:#191f2b;--line:#30394a;--muted:#a0adc0;--accent:#9decba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e9eef6;font:15px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:25px;margin:0;letter-spacing:-1px}h1 span{color:var(--accent)}.tag{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:230px 1fr;gap:24px}aside,.chat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}aside{align-self:start}h2{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:0 0 16px}.setting{margin-bottom:20px}.setting span{display:block;color:var(--muted);font-size:12px}.setting strong{font-weight:500;overflow-wrap:anywhere}.chat{min-height:65vh;display:flex;flex-direction:column}#events{flex:1;max-height:60vh;overflow:auto}article{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:16px}article small{color:var(--accent);text-transform:uppercase;font-size:11px;letter-spacing:1px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace;margin:8px 0 0}details{color:var(--muted);margin:10px 0}summary{cursor:pointer}textarea{resize:vertical;min-height:90px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:inherit;padding:12px;font:inherit}button{background:var(--accent);border:0;border-radius:7px;padding:9px 16px;font-weight:650;cursor:pointer}button.secondary{background:var(--line);color:white}button:disabled{opacity:.5;cursor:wait}.form-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}#status,#error{font-size:12px;color:var(--muted)}#error{color:#ff9c9c}.approval{background:#25372c;border:1px solid var(--accent);border-radius:10px;padding:15px;margin:12px 0}.approval button{margin:10px 8px 0 0}#empty{color:var(--muted);text-align:center;margin:80px 0}.mark{background:#263c30;padding:8px 12px;border-radius:8px;color:var(--accent)}@media(max-width:750px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:18px}.chat{min-height:75vh}}
</style></head><body><main><header><div><h1><span>awesome</span>-smolcode</h1><div class="tag">A little bigger. A lot more capable.</div></div><div class="mark">local workspace</div></header><div class="layout"><aside><h2>Workspace</h2><div id="settings"></div><div class="tag">Permissions apply to every tool. Approvals are single use and expire after two minutes.</div></aside><section class="chat"><div id="events"><div id="empty">What should we build?<br><small>Inspect, change, and test code in your workspace.</small></div></div><div id="approvals"></div><form id="form"><label for="message" class="tag">Message</label><textarea id="message" placeholder="Review this project and fix the failing tests…" required></textarea><div class="form-bottom"><span id="status">Connecting…</span><button id="send">Send request ↗</button></div><div id="error" role="alert"></div></form></section></div></main>
<script>
const fragment=new URLSearchParams(location.hash.slice(1));let token=fragment.get('token')||sessionStorage.getItem('awesome-token');if(token)sessionStorage.setItem('awesome-token',token);history.replaceState(null,'','/');let last=0;
const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch('/api/'+path,{headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{method:'POST',body:JSON.stringify(body)}:{})});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function event(e){if(e.seq<=last)return;last=e.seq;$('empty')?.remove();const a=node('article','');if(['tool','result','permission'].includes(e.type)){const d=node('details','');d.append(node('summary',e.type+' · '+e.tool));d.append(node('pre',e.text||JSON.stringify(e.arguments||{allowed:e.allowed},null,2)));a.append(d)}else{a.append(node('small',e.type));a.append(node('pre',e.text||''))}$('events').append(a);while($('events').children.length>500)$('events').firstChild.remove();$('events').scrollTop=$('events').scrollHeight}
async function poll(){try{const s=await api('state');$('settings').replaceChildren();for(const key of ['workspace','model','session','permission','sandbox','network']){const d=node('div','');d.className='setting';d.append(node('span',key));d.append(node('strong',String(s[key])));$('settings').append(d)}s.events.forEach(event);$('status').textContent=s.busy?'Working…':'Ready';$('send').disabled=s.busy;$('approvals').replaceChildren();for(const p of s.approvals){const d=node('div','');d.className='approval';d.append(node('strong','Permission requested: '+p.tool));d.append(node('pre',JSON.stringify(p.arguments,null,2)));for(const [label,allow] of [['Allow once',true],['Deny',false]]){const b=node('button',label);if(!allow)b.className='secondary';b.onclick=async()=>{try{await api('approval',{id:p.id,allow});await poll()}catch(e){$('error').textContent=e.message}};d.append(b)}$('approvals').append(d)}$('error').textContent=''}catch(e){$('status').textContent='Disconnected';$('error').textContent=e.message}}
$('form').onsubmit=async e=>{e.preventDefault();try{await api('message',{message:$('message').value});$('message').value='';await poll()}catch(e){$('error').textContent=e.message}};poll();setInterval(poll,1000);
</script></body></html>
