[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-smolcode"
version = "0.1.0"
description = "A small coding agent with practical integrations and explicit permissions"
requires-python = ">=3.11"

[project.scripts]
awesome-smolcode = "awesome_smolcode.cli:main"

[tool.setuptools.package-data]
awesome_smolcode = ["web.html"]

[tool.setuptools.packages.find]
include = ["awesome_smolcode*"]
